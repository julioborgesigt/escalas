# ════════════════════════════════════════════════════════════════════════
# wrangler.workers.toml — config de MODO WORKERS (migração Pages → Workers).
#
# Por que um arquivo SEPARADO do wrangler.toml (que segue em modo Pages):
#   O @sveltejs/adapter-cloudflare decide o formato da SAÍDA DO BUILD pela
#   config do wrangler lida em tempo de build (`pages_build_output_dir` ⇒
#   Pages; `main` + `assets` ⇒ Workers). Manter os dois modos no MESMO arquivo
#   é impossível. Enquanto o domínio de produção segue no projeto Pages
#   (rollback quente), produção continua usando wrangler.toml (Pages) e SÓ o
#   staging usa este arquivo. Selecione-o no build com a env WRANGLER_CONFIG
#   (ver svelte.config.js) e no deploy com `--config wrangler.workers.toml`.
#
# Plano completo e contexto (auditoria A3): docs/MIGRACAO-WORKERS.md.
# ════════════════════════════════════════════════════════════════════════

name = "escalas"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-04-01"
# MANTER — o projeto usa node:crypto (timingSafeEqual, Buffer) em auth, CSRF e
# verificação de assinatura.
compatibility_flags = ["nodejs_compat"]

# Static assets servidos pelo Worker (substitui o pages_build_output_dir).
# `directory` aponta para a MESMA pasta do build; o adapter grava um
# `.assetsignore` que exclui `_worker.js` de ser servido como asset estático.
[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"

# Teto de CPU por request — o ganho central da migração (A3). Libera as 600k
# iterações OWASP do PBKDF2 e dá folga à cripto/PDF. NÃO habilita o 600k por
# si só: isso é uma troca de código em src/lib/auth.ts (Fase 4), feita após o
# cutover e com confirmação. Aqui apenas removemos o teto ~50ms das Pages.
[limits]
cpu_ms = 300000

# Logs/Analytics do Worker no Dashboard — usados na Fase 2 para confirmar o
# headroom de CPU medido.
[observability]
enabled = true

# Variáveis NÃO-secretas. Secrets (RESEND_API_KEY, SYNC_TOKEN, etc.) entram via
# `wrangler secret put` / Dashboard — ver docs/MIGRACAO-WORKERS.md §4.4.
[vars]
TSA_URL = "http://timestamp.digicert.com"

[[d1_databases]]
binding = "escalas_db"
database_name = "escalas-db"
database_id = "dc86ec72-7ed4-4e8c-9d29-67a4e509ea49"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "escalas_docs"
bucket_name = "escalas-docs"

# ─────────────────────────────────────────────────────────────────────────
# Ambiente STAGING (substitui o [env.preview] do Pages).
#
# `wrangler deploy --env staging --config wrangler.workers.toml` publica um
# Worker SEPARADO chamado `escalas-staging`, com seu próprio *.workers.dev e
# bindings DEDICADOS de staging — nunca toca o D1/R2 de produção. Named
# environments do wrangler NÃO herdam bindings do topo, então d1/r2/assets/
# limits/vars são redeclarados aqui de propósito.
# ─────────────────────────────────────────────────────────────────────────
[env.staging.vars]
TSA_URL = "http://timestamp.digicert.com"

[env.staging.assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"

[env.staging.limits]
cpu_ms = 300000

[env.staging.observability]
enabled = true

[[env.staging.d1_databases]]
binding = "escalas_db"
database_name = "escalas-db-staging"
database_id = "c4da26fa-a92a-4553-9869-e53474ec4948"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "escalas_docs"
bucket_name = "escalas-docs-staging"

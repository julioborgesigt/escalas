name: CI & Deploy

on:
  # Roda em todo PR para main/staging — bloqueia merge se algum step falhar.
  # Configure branch protection no GitHub (Settings → Branches → Add rule)
  # para exigir o job "test" antes de permitir merge.
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

# Cancela runs anteriores quando um novo commit é pushado para o mesmo PR.
#
# `cancel-in-progress` SÓ em pull_request, nunca em push. Num push para main o
# `github.ref` é `refs/heads/main`, então dois merges em sequência colocariam os
# dois runs no mesmo grupo e o segundo cancelaria o primeiro — que é justamente
# o run que faz `db:migrate:prod` + `pages deploy`. O `migrate.ts` só grava em
# `_migrations_aplicadas` DEPOIS do `d1 execute`, então um cancelamento nessa
# janela deixa a migração aplicada e não registrada.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Build do SvelteKit (gera .svelte-kit/tsconfig.json, tipos, etc.)
      # antes do svelte-check, senão ele falha por falta de tipos gerados.
      - run: npx svelte-kit sync

      # Lint — a dívida do ratchet foi paga: `lint:ci` roda com
      # `--max-warnings 0` (equivalente a `lint:strict`) e a base está limpa.
      # Qualquer warning novo falha o CI.
      - run: npm run lint:ci
      # Format e knip viraram gates HARD (a base zerou — plano ratchet
      # concluído). Se falharem: `npm run format` / remover o código morto
      # apontado pelo knip.
      - run: npm run format:check
      - run: npm run knip

      # Gates HARD — qualquer falha aqui bloqueia merge:
      - run: npx svelte-check --threshold error
      # `--coverage` imprime o resumo de cobertura de src/lib no log
      # (informativo — sem threshold; ver vite.config.ts para travar um
      # piso quando os números estabilizarem). Os testes seguem sendo gate.
      - run: npx vitest run --reporter=verbose --coverage
      - run: npm run build

      # ⚠️ O upload TEM de ficar aqui, colado no build, e ANTES dos passos de
      # E2E. O `e2e/servidor-e2e.ts` roda `npm run build` de novo com
      # `E2E_TEST_CA=1`, que inlina a raiz de CA de TESTE no trust store
      # ICP-Brasil e SOBRESCREVE `.svelte-kit/cloudflare`. Subir o artefato
      # depois do E2E publicaria essa raiz de teste em produção.
      - name: Guardar build de produção para os jobs de deploy
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: build-cloudflare
          path: .svelte-kit/cloudflare
          retention-days: 1
          if-no-files-found: error

      # Guard contra regressão do padrão API: todas as rotas devem usar
      # os helpers de \$lib/server/api (badRequest, unauthorized, etc.) em
      # vez de retornar json({ error }) manual. Ver CLAUDE.md → "Erros de
      # API — padrão obrigatório".
      - name: Guard — padrão de erros API (lib/server/api)
        run: |
          violations=$(grep -rln "return json({ error" src/routes/api || true)
          if [ -n "$violations" ]; then
            echo "::error::Rotas API usando json({ error }) manual — use os helpers de \$lib/server/api:"
            echo "$violations"
            exit 1
          fi

      # Guard contra regressão da P0.1/P0.3 da auditoria: o GET de qualquer
      # documento assinado (PDF + metadados) DEVE invocar o helper de
      # permissão correto antes de devolver o recurso. Apenas requireAuth
      # não basta — qualquer usuário autenticado conseguia baixar PDF de
      # outra unidade. O grep abaixo confirma que cada rota crítica ainda
      # importa o helper de permissão.
      - name: Guard — permissão de documento assinado (P0.1 / P0.3)
        run: |
          set -e
          check_imports() {
            local file=$1
            local helper=$2
            if ! grep -q "$helper" "$file"; then
              echo "::error file=$file::regressão de segurança — falta importar \"$helper\""
              return 1
            fi
          }
          check_imports src/routes/api/escalas/\[id\]/documento-assinado/+server.ts verificarPermissaoEscala
          check_imports src/routes/api/gise/\[id\]/documento-assinado/+server.ts verificarPermissaoGise
          check_imports src/routes/api/gise/\[id\]/documento-assinado/info/+server.ts verificarPermissaoGise
          check_imports src/routes/api/gise/\[id\]/download/+server.ts verificarPermissaoGise

      # Guard de documentação: arquivo NOVO em src/lib/db/ tem de nascer com
      # cabeçalho de módulo e JSDoc nos exports. Só arquivos ADICIONADOS no
      # diff — o legado é pago em levas, medido por `npm run docs:inventario`
      # (varredura de jul/2026 — ver docs/HISTORICO.md). Aqui só impedimos que
      # volte a crescer.
      - name: Guard — documentação de arquivo novo em lib/db
        run: |
          BASE="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          # O checkout é raso (depth 1): sem buscar a base, o `git diff` não
          # tem com o que comparar e o guard se auto-desliga com um aviso.
          git fetch --no-tags --depth=50 origin "$BASE" 2>/dev/null || true
          node scripts/guard-docs-novos.mjs "$BASE"

      - name: Apply D1 migrations (local, for E2E)
        run: npx wrangler d1 migrations apply escalas-db --local

      # O browser são ~150 MB baixados a cada run. A chave é a VERSÃO do
      # @playwright/test resolvida no lockfile: o binário é atrelado a ela, e
      # assim o cache invalida sozinho quando o dependabot sobe a versão.
      - name: Versão do Playwright (chave do cache)
        id: pw
        run: echo "versao=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache do browser do Playwright
        id: cache-pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.versao }}

      # No cache hit só faltam as libs de sistema (`--with-deps` instala via
      # apt, fora de ~/.cache) — o `--only-shell` não serve porque a suíte usa
      # o Chromium completo.
      - name: Install Playwright (Chromium)
        run: |
          if [ "${{ steps.cache-pw.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: End-to-end tests
        run: npx playwright test

  deploy-staging:
    # Só faz deploy em PUSH para staging (não em PR).
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # `npm ci` continua necessário: o passo de migração roda `tsx` +
      # `wrangler` do node_modules. O que sai é o `npm run build` — o artefato
      # vem pronto do job `test`, que já buildou o MESMO commit.
      - run: npm ci

      - name: Baixar build de produção do job `test`
        uses: actions/download-artifact@v4
        with:
          name: build-cloudflare
          path: .svelte-kit/cloudflare

      # Migra o D1 de STAGING antes do deploy. O script é INCREMENTAL: controla
      # o que já foi aplicado em `_migrations_aplicadas` e só executa as
      # pendentes. Migration antes do deploy = código antigo convive por
      # instantes com o schema novo — seguro porque as migrations do projeto
      # são retrocompatíveis (expand-contract). Se a migration falhar, o
      # deploy nem roda.
      - name: Apply D1 migrations (staging)
        run: npm run db:migrate:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .svelte-kit/cloudflare --project-name=escalas --branch=staging

  deploy-production:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # Idem staging: `npm ci` para o `tsx`/`wrangler` da migração; o build vem
      # pronto do job `test` (mesmo commit, e sem a raiz de CA de teste do E2E).
      - run: npm ci

      - name: Baixar build de produção do job `test`
        uses: actions/download-artifact@v4
        with:
          name: build-cloudflare
          path: .svelte-kit/cloudflare

      # Migra o D1 de PRODUÇÃO antes do deploy (incremental — só as pendentes
      # de `_migrations_aplicadas`; `--yes` é a confirmação exigida pelo
      # script para produção). Falhou a migration → o deploy não acontece.
      - name: Apply D1 migrations (produção)
        run: npm run db:migrate:prod -- --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .svelte-kit/cloudflare --project-name=escalas
